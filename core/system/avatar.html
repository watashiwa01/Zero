<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zero Minecraft Voxel Visualizer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0); /* Transparent web view */
            user-select: none;
            -webkit-user-select: none;
            -webkit-app-region: drag;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            image-rendering: pixelated; /* Crisp pixel style */
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="avatarCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('avatarCanvas');
        const ctx = canvas.getContext('2d');

        // Flat Minecraft colors
        const SKIN_COLOR = '#e5a07c';       // Peach skin
        const SKIN_SHADOW = '#c07e5e';      // Skin shadow
        const HAIR_COLOR = '#3e2417';       // Flat brown hair
        const HAT_BASE = '#ffffff';         // White blocks
        const HAT_GOLD = '#dcb013';         // Gold blocks
        const GEM_RED = '#b00000';          // Ruby block
        const EYE_VIOLET = '#7828a0';       // Purple eyes
        const EYE_PUPIL = '#111111';        // Black eye pixel
        const OUTFIT_COLOR = '#1f1c24';     // Charcoal body
        const HAT_PURPLE = '#3d254b';       // Dark purple horn blocks

        const STATES = {
            idle: { color: '#39ff14', speed: 1.0, pose: 'idle' },
            listening: { color: '#00ffff', speed: 2.2, pose: 'listening' },
            thinking: { color: '#ff00ff', speed: 3.5, pose: 'thinking' },
            speaking: { color: '#00ffaa', speed: 1.8, pose: 'speaking' }
        };

        let currentState = 'idle';
        let targetState = 'idle';
        let transitionProgress = 1.0;
        let currentColor = STATES.idle.color;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.setAvatarState = function(state) {
            if (STATES[state]) {
                targetState = state;
                transitionProgress = 0.0;
            }
        };

        let blinkTimer = 0;
        let isBlinking = false;
        const blinkDuration = 10;
        let blinkFrame = 0;

        function lerpColor(color1, color2, factor) {
            const c1 = parseInt(color1.substring(1), 16);
            const c2 = parseInt(color2.substring(1), 16);
            const r1 = (c1 >> 16) & 255, g1 = (c1 >> 8) & 255, b1 = c1 & 255;
            const r2 = (c2 >> 16) & 255, g2 = (c2 >> 8) & 255, b2 = c2 & 255;
            const r = Math.round(r1 + factor * (r2 - r1));
            const g = Math.round(g1 + factor * (g2 - g1));
            const b = Math.round(b1 + factor * (b2 - b1));
            return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        // Helper to draw a pixelated/voxel block with bevel/borders
        function drawBlock(x, y, w, h, fill, border = null) {
            ctx.fillStyle = fill;
            ctx.fillRect(x, y, w, h);
            if (border) {
                ctx.strokeStyle = border;
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, w, h);
            }
        }

        let time = 0;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const speed = STATES[currentState].speed;
            const pose = STATES[currentState].pose;
            time += 0.03 * speed;

            if (transitionProgress < 1.0) {
                transitionProgress += 0.05;
                if (transitionProgress > 1.0) transitionProgress = 1.0;
                currentColor = lerpColor(STATES[currentState].color, STATES[targetState].color, transitionProgress);
                if (transitionProgress === 1.0) {
                    currentState = targetState;
                }
            } else {
                currentColor = STATES[currentState].color;
            }

            blinkTimer++;
            if (!isBlinking && blinkTimer > 180 + Math.random() * 200) {
                isBlinking = true;
                blinkFrame = 0;
            }
            if (isBlinking) {
                blinkFrame++;
                if (blinkFrame >= blinkDuration) {
                    isBlinking = false;
                    blinkTimer = 0;
                }
            }

            const cx = canvas.width / 2;
            const cy = canvas.height / 2 + 10;
            const bob = Math.sin(time * 2) * 5;
            const headY = cy - 40 + bob;

            // 1. Draw blocky ground shadow/grid
            ctx.strokeStyle = '#22222b';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.rect(cx - 60, cy + 120, 120, 16);
            ctx.stroke();

            // 2. Draw Torso Block (Minecraft style)
            drawBlock(cx - 40, cy + 30, 80, 80, OUTFIT_COLOR);
            // Collar detail blocks
            drawBlock(cx - 24, cy + 30, 48, 12, HAT_BASE);
            drawBlock(cx - 8, cy + 30, 16, 12, SKIN_COLOR);

            // Left/Right shoulder blocks
            drawBlock(cx - 50, cy + 30, 10, 20, currentColor);
            drawBlock(cx + 40, cy + 30, 10, 20, currentColor);

            // Neck Block
            drawBlock(cx - 12, headY + 15, 24, 30, SKIN_COLOR);

            // 3. Back Hair Blocks (Spiky steps)
            drawBlock(cx - 48, headY - 15, 12, 35, HAIR_COLOR);
            drawBlock(cx - 48, headY - 35, 12, 20, HAIR_COLOR);
            drawBlock(cx + 36, headY - 15, 12, 35, HAIR_COLOR);
            drawBlock(cx + 36, headY - 35, 12, 20, HAIR_COLOR);

            // 4. Face Block (Large Minecraft cube)
            drawBlock(cx - 36, headY - 25, 72, 60, SKIN_COLOR);

            // 5. Square Pixelated Anime Eyes
            const leftEyeX = cx - 22;
            const rightEyeX = cx + 8;
            const eyeY = headY - 5;
            const eyeSize = 14;

            if (isBlinking) {
                // Closed flat eye block
                drawBlock(leftEyeX, eyeY + 6, eyeSize, 3, SKIN_SHADOW);
                drawBlock(rightEyeX, eyeY + 6, eyeSize, 3, SKIN_SHADOW);
            } else {
                // Purple iris block
                drawBlock(leftEyeX, eyeY, eyeSize, eyeSize, EYE_VIOLET);
                drawBlock(rightEyeX, eyeY, eyeSize, eyeSize, EYE_VIOLET);
                
                // Black pupil pixel block
                drawBlock(leftEyeX + 4, eyeY + 4, 8, 8, EYE_PUPIL);
                drawBlock(rightEyeX + 2, eyeY + 4, 8, 8, EYE_PUPIL);

                // Glossy white highlight pixel block
                drawBlock(leftEyeX + 8, eyeY, 6, 6, '#ffffff');
                drawBlock(rightEyeX + 6, eyeY, 6, 6, '#ffffff');
            }

            // Eyebrow pixel block
            drawBlock(leftEyeX - 2, eyeY - 8, 18, 3, HAIR_COLOR);
            drawBlock(rightEyeX - 2, eyeY - 8, 18, 3, HAIR_COLOR);

            // Cheek blush pixels
            drawBlock(leftEyeX - 4, eyeY + 16, 6, 4, '#ff9999');
            drawBlock(rightEyeX + 12, eyeY + 16, 6, 4, '#ff9999');

            // 6. Front Hair Bangs (Square pixel chunks overlap forehead)
            drawBlock(cx - 38, headY - 25, 10, 16, HAIR_COLOR);
            drawBlock(cx - 28, headY - 25, 12, 24, HAIR_COLOR);
            drawBlock(cx - 16, headY - 25, 10, 12, HAIR_COLOR);
            drawBlock(cx - 6, headY - 25, 12, 28, HAIR_COLOR);
            drawBlock(cx + 6, headY - 25, 10, 16, HAIR_COLOR);
            drawBlock(cx + 16, headY - 25, 12, 24, HAIR_COLOR);
            drawBlock(cx + 28, headY - 25, 10, 12, HAIR_COLOR);

            // Side locks
            drawBlock(cx - 42, headY - 5, 8, 36, HAIR_COLOR);
            drawBlock(cx + 34, headY - 5, 8, 36, HAIR_COLOR);

            // 7. Minecraft Hat Structure
            // Horn blocks (Curved voxel paths)
            drawBlock(cx - 48, headY - 35, 12, 12, HAT_PURPLE);
            drawBlock(cx - 64, headY - 47, 16, 12, HAT_PURPLE);
            drawBlock(cx - 80, headY - 35, 16, 12, HAT_PURPLE);
            drawBlock(cx - 88, headY - 23, 12, 16, HAT_PURPLE);
            // Bell dangling at end
            drawBlock(cx - 88, headY - 7 + Math.sin(time * 3.5) * 2, 8, 8, SKIN_COLOR);

            drawBlock(cx + 36, headY - 35, 12, 12, HAT_PURPLE);
            drawBlock(cx + 48, headY - 47, 16, 12, HAT_PURPLE);
            drawBlock(cx + 64, headY - 35, 16, 12, HAT_PURPLE);
            drawBlock(cx + 76, headY - 23, 12, 16, HAT_PURPLE);
            // Bell dangling at end
            drawBlock(cx + 80, headY - 7 + Math.sin(time * 3.5 + Math.PI) * 2, 8, 8, SKIN_COLOR);

            // Main Cap block
            drawBlock(cx - 36, headY - 37, 72, 12, HAT_BASE);
            drawBlock(cx - 36, headY - 29, 72, 4, HAT_GOLD); // Gold border trim

            // Raised Crown blocks
            drawBlock(cx - 18, headY - 47, 36, 10, HAT_BASE);
            drawBlock(cx - 18, headY - 51, 36, 4, HAT_GOLD);

            // Gold diamond bezel blocks
            drawBlock(cx - 10, headY - 43, 20, 12, HAT_GOLD);
            drawBlock(cx - 6, headY - 45, 12, 16, HAT_GOLD);

            // Ruby red gem block
            drawBlock(cx - 4, headY - 41, 8, 8, GEM_RED);
            // Shine pixel
            drawBlock(cx, headY - 41, 2, 2, '#ffffff');

            // 8. Voxel Mouth (Speaking animation checks)
            if (pose === 'speaking') {
                const openH = 4 + Math.abs(Math.sin(time * 12)) * 8;
                drawBlock(cx - 6, headY + 22 - openH/2, 12, openH, '#501111');
            } else {
                // Pixel smile line
                drawBlock(cx - 8, headY + 20, 16, 3, '#501111');
                drawBlock(cx - 11, headY + 17, 3, 3, '#501111');
                drawBlock(cx + 8, headY + 17, 3, 3, '#501111');
            }

            // 9. Status & Particle Pixel rings
            ctx.shadowBlur = 0;

            // Halo above head (square pixel path)
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = 4;
            ctx.strokeRect(cx - 30, headY - 65, 60, 10);

            // Side indicators
            drawBlock(cx + 80, cy + 100, 6, 6, currentColor);
            drawBlock(cx + 88, cy + 100, 8, 8, currentColor);

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
