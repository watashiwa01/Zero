<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zero Anime Puppet</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0);
            user-select: none;
            -webkit-user-select: none;
            -webkit-app-region: drag;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <script>
        // Color Palette from user image
        const SKIN_COLOR = 0xffeedd;        // Pale fair skin
        const HAIR_COLOR = 0x4a3225;        // Spiky brown hair
        const HAT_BASE = 0xffffff;          // White hat
        const HAT_GOLD = 0xffd700;          // Gold trim
        const GEM_RED = 0xd00000;           // Ruby red gem
        const EYE_VIOLET = 0x8a2be2;        // Violet/purple anime eyes
        const OUTFIT_COLOR = 0x1a1a1e;      // Dark clothing
        const ACCENT_COLOR = 0x39ff14;      // Neon green status accent

        // State parameters
        const STATES = {
            idle: {
                color: ACCENT_COLOR,
                speed: 1.0,
                pose: 'idle'
            },
            listening: {
                color: 0x00ffff,           // Cyan pulse
                speed: 2.0,
                pose: 'listening'
            },
            thinking: {
                color: 0xff00ff,           // Magenta pulse
                speed: 3.0,
                pose: 'thinking'
            },
            speaking: {
                color: 0x00ffaa,           // Teal pulse
                speed: 1.5,
                pose: 'speaking'
            }
        };

        let currentState = 'idle';
        let targetState = 'idle';
        let transitionProgress = 1.0;

        // Setup Scene
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.5, 6.2);
        camera.lookAt(0, 0, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
        dirLight.position.set(2, 4, 5);
        scene.add(dirLight);

        // Grid floor helper
        const gridHelper = new THREE.GridHelper(8, 16, 0x444455, 0x22222b);
        gridHelper.position.y = -2.1;
        scene.add(gridHelper);

        // Materials setup
        const skinMat = new THREE.MeshLambertMaterial({ color: SKIN_COLOR });
        const hairMat = new THREE.MeshLambertMaterial({ color: HAIR_COLOR });
        const whiteMat = new THREE.MeshLambertMaterial({ color: HAT_BASE });
        const goldMat = new THREE.MeshStandardMaterial({ color: HAT_GOLD, roughness: 0.3, metalness: 0.8 });
        const gemMat = new THREE.MeshStandardMaterial({ color: GEM_RED, roughness: 0.1, metalness: 0.1, emissive: 0x330000 });
        const outfitMat = new THREE.MeshLambertMaterial({ color: OUTFIT_COLOR });
        
        // Status Glow Material
        const glowMat = new THREE.MeshBasicMaterial({
            color: ACCENT_COLOR,
            transparent: true,
            opacity: 0.95
        });

        // Main Character Group
        const character = new THREE.Group();
        character.position.y = -0.5;
        scene.add(character);

        // --- RIGGING HIERARCHY ---

        // 1. Torso & Collar
        const torsoGeo = new THREE.CylinderGeometry(0.55, 0.45, 1.3, 8);
        const torso = new THREE.Mesh(torsoGeo, outfitMat);
        torso.position.y = 0.55;
        character.add(torso);

        const beltGeo = new THREE.CylinderGeometry(0.58, 0.56, 0.2, 8);
        const belt = new THREE.Mesh(beltGeo, whiteMat);
        belt.position.y = 0.3;
        character.add(belt);

        const collarGeo = new THREE.CylinderGeometry(0.35, 0.45, 0.18, 8);
        const collar = new THREE.Mesh(collarGeo, outfitMat);
        collar.position.y = 1.15;
        character.add(collar);

        // Shoulder pads
        const padGeo = new THREE.BoxGeometry(0.3, 0.15, 0.3);
        const padL = new THREE.Mesh(padGeo, glowMat);
        padL.position.set(-0.6, 1.1, 0);
        character.add(padL);

        const padR = padL.clone();
        padR.position.x = 0.6;
        character.add(padR);

        // 2. Head Group
        const headGroup = new THREE.Group();
        headGroup.position.y = 1.45;
        character.add(headGroup);

        // Face Mesh
        const faceGeo = new THREE.BoxGeometry(0.42, 0.42, 0.42);
        const face = new THREE.Mesh(faceGeo, skinMat);
        headGroup.add(face);

        // --- DETAILED ANIME EYES ---
        // Violet base
        const eyeBgGeo = new THREE.CircleGeometry(0.08, 16);
        const eyeBgMat = new THREE.MeshBasicMaterial({ color: EYE_VIOLET });
        
        const eyeL = new THREE.Mesh(eyeBgGeo, eyeBgMat);
        eyeL.position.set(-0.11, 0.04, 0.22);
        headGroup.add(eyeL);

        const eyeR = eyeL.clone();
        eyeR.position.x = 0.11;
        headGroup.add(eyeR);

        // Black pupils
        const pupilGeo = new THREE.CircleGeometry(0.04, 8);
        const pupilMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
        const pupilL = new THREE.Mesh(pupilGeo, pupilMat);
        pupilL.position.set(-0.11, 0.02, 0.23);
        headGroup.add(pupilL);

        const pupilR = pupilL.clone();
        pupilR.position.x = 0.11;
        headGroup.add(pupilR);

        // White highlights (Gives signature anime look)
        const shineGeo = new THREE.CircleGeometry(0.02, 8);
        const shineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const shineL = new THREE.Mesh(shineGeo, shineMat);
        shineL.position.set(-0.09, 0.06, 0.24);
        headGroup.add(shineL);

        const shineR = shineL.clone();
        shineR.position.x = 0.13;
        headGroup.add(shineR);

        // Mouth (Smile)
        const mouthGeo = new THREE.BoxGeometry(0.08, 0.02, 0.02);
        const mouthMat = new THREE.MeshBasicMaterial({ color: 0x4a1111 });
        const mouth = new THREE.Mesh(mouthGeo, mouthMat);
        mouth.position.set(0, -0.1, 0.22);
        headGroup.add(mouth);

        // --- MESSY SPIKY ANIME HAIR ---
        const hairGroup = new THREE.Group();
        headGroup.add(hairGroup);

        // Bangs (Forehead strands)
        const bangsCount = 8;
        for (let i = 0; i < bangsCount; i++) {
            const bangGeo = new THREE.ConeGeometry(0.06, 0.25, 4);
            const bang = new THREE.Mesh(bangGeo, hairMat);
            
            // Distribute across forehead
            const ratio = (i / (bangsCount - 1)) - 0.5; // -0.5 to 0.5
            bang.position.set(ratio * 0.44, 0.18, 0.22);
            bang.rotation.x = Math.PI / 8;
            bang.rotation.z = -ratio * 0.4;
            hairGroup.add(bang);
        }

        // Side hair strands (framing face)
        const sideStrandGeo = new THREE.ConeGeometry(0.08, 0.45, 4);
        const sideL1 = new THREE.Mesh(sideStrandGeo, hairMat);
        sideL1.position.set(-0.24, -0.05, 0.18);
        sideL1.rotation.z = -Math.PI / 16;
        hairGroup.add(sideL1);

        const sideL2 = sideL1.clone();
        sideL2.position.set(-0.26, -0.22, 0.1);
        sideL2.rotation.z = -Math.PI / 8;
        hairGroup.add(sideL2);

        const sideR1 = sideL1.clone();
        sideR1.position.x = 0.24;
        sideR1.rotation.z = Math.PI / 16;
        hairGroup.add(sideR1);

        const sideR2 = sideL2.clone();
        sideR2.position.x = 0.26;
        sideR2.rotation.z = Math.PI / 8;
        hairGroup.add(sideR2);

        // Spiky top/back hair clusters
        const spikyClusters = [
            { pos: [-0.15, 0.28, -0.15], rot: [-0.4, 0.2, 0.5] },
            { pos: [0.15, 0.28, -0.15], rot: [-0.4, -0.2, -0.5] },
            { pos: [0.0, 0.3, -0.2], rot: [-0.5, 0, 0] },
            { pos: [-0.2, 0.15, -0.25], rot: [0.2, 0.4, 0.8] },
            { pos: [0.2, 0.15, -0.25], rot: [0.2, -0.4, -0.8] }
        ];

        spikyClusters.forEach(cfg => {
            const spikeGeo = new THREE.ConeGeometry(0.12, 0.4, 4);
            const spike = new THREE.Mesh(spikeGeo, hairMat);
            spike.position.set(...cfg.pos);
            spike.rotation.set(...cfg.rot);
            hairGroup.add(spike);
        });

        // --- WHITE & GOLD HAT WITH RED GEM ---
        // White Cap Base
        const hatBaseGeo = new THREE.CylinderGeometry(0.35, 0.28, 0.2, 16);
        const hatBase = new THREE.Mesh(hatBaseGeo, whiteMat);
        hatBase.position.y = 0.3;
        headGroup.add(hatBase);

        // Gold Trim Border
        const hatTrimGeo = new THREE.TorusGeometry(0.34, 0.03, 8, 32);
        const hatTrim = new THREE.Mesh(hatTrimGeo, goldMat);
        hatTrim.position.y = 0.21;
        hatTrim.rotation.x = Math.PI / 2;
        headGroup.add(hatTrim);

        // Raised Front Crown Shape
        const crownGeo = new THREE.BoxGeometry(0.35, 0.2, 0.06);
        const crown = new THREE.Mesh(crownGeo, whiteMat);
        crown.position.set(0, 0.38, 0.18);
        crown.rotation.x = -Math.PI / 16;
        headGroup.add(crown);

        const crownGoldTrim = new THREE.Mesh(new THREE.BoxGeometry(0.37, 0.03, 0.08), goldMat);
        crownGoldTrim.position.set(0, 0.47, 0.19);
        crownGoldTrim.rotation.x = -Math.PI / 16;
        headGroup.add(crownGoldTrim);

        // Gold Diamond Gem Bezel
        const bezelGeo = new THREE.BoxGeometry(0.18, 0.18, 0.04);
        const bezel = new THREE.Mesh(bezelGeo, goldMat);
        bezel.position.set(0, 0.38, 0.22);
        bezel.rotation.set(-Math.PI / 16, 0, Math.PI / 4); // Rotated to form diamond
        headGroup.add(bezel);

        // Glowing Ruby Red Gem
        const gemGeo = new THREE.SphereGeometry(0.08, 16, 16);
        const gem = new THREE.Mesh(gemGeo, gemMat);
        gem.position.set(0, 0.38, 0.25);
        headGroup.add(gem);

        // 5. LEFT ARM HIERARCHY
        const leftArmGroup = new THREE.Group();
        leftArmGroup.position.set(-0.65, 1.0, 0);
        character.add(leftArmGroup);

        const upperArmLGeo = new THREE.CylinderGeometry(0.12, 0.15, 0.6, 8);
        const upperArmL = new THREE.Mesh(upperArmLGeo, skinMat);
        upperArmL.position.y = -0.25;
        leftArmGroup.add(upperArmL);

        const forearmLGroup = new THREE.Group();
        forearmLGroup.position.set(0, -0.5, 0);
        leftArmGroup.add(forearmLGroup);

        const forearmLGeo = new THREE.CylinderGeometry(0.14, 0.12, 0.5, 8);
        const forearmL = new THREE.Mesh(forearmLGeo, skinMat);
        forearmL.position.y = -0.2;
        forearmLGroup.add(forearmL);

        const handLGeo = new THREE.SphereGeometry(0.08, 8, 8);
        const handL = new THREE.Mesh(handLGeo, outfitMat);
        handL.position.y = -0.45;
        forearmLGroup.add(handL);

        // 6. RIGHT ARM HIERARCHY
        const rightArmGroup = new THREE.Group();
        rightArmGroup.position.set(0.65, 1.0, 0);
        character.add(rightArmGroup);

        const upperArmRGeo = new THREE.CylinderGeometry(0.12, 0.15, 0.6, 8);
        const upperArmR = new THREE.Mesh(upperArmRGeo, skinMat);
        upperArmR.position.y = -0.25;
        rightArmGroup.add(upperArmR);

        const forearmRGroup = new THREE.Group();
        forearmRGroup.position.set(0, -0.5, 0);
        rightArmGroup.add(forearmRGroup);

        const forearmRGeo = new THREE.CylinderGeometry(0.14, 0.12, 0.5, 8);
        const forearmR = new THREE.Mesh(forearmRGeo, skinMat);
        forearmR.position.y = -0.2;
        forearmRGroup.add(forearmR);

        const handRGeo = new THREE.SphereGeometry(0.08, 8, 8);
        const handR = new THREE.Mesh(handRGeo, outfitMat);
        handR.position.y = -0.45;
        forearmRGroup.add(handR);

        // 7. LEFT LEG HIERARCHY
        const leftLegGroup = new THREE.Group();
        leftLegGroup.position.set(-0.25, 0, 0);
        character.add(leftLegGroup);

        const thighLGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.8, 8);
        const thighL = new THREE.Mesh(thighLGeo, skinMat);
        thighL.position.y = -0.4;
        leftLegGroup.add(thighL);

        const kneeLGeo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
        const kneeL = new THREE.Mesh(kneeLGeo, glowMat);
        kneeL.position.set(0, -0.8, 0.05);
        kneeL.rotation.z = Math.PI / 4;
        leftLegGroup.add(kneeL);

        const shinLGeo = new THREE.CylinderGeometry(0.18, 0.14, 0.7, 8);
        const shinL = new THREE.Mesh(shinLGeo, outfitMat);
        shinL.position.y = -1.15;
        leftLegGroup.add(shinL);

        const footLGeo = new THREE.ConeGeometry(0.14, 0.35, 4);
        const footL = new THREE.Mesh(footLGeo, whiteMat);
        footL.position.set(0, -1.45, 0.1);
        footL.rotation.x = Math.PI / 2.2;
        leftLegGroup.add(footL);

        // 8. RIGHT LEG HIERARCHY
        const rightLegGroup = new THREE.Group();
        rightLegGroup.position.set(0.25, 0, 0);
        character.add(rightLegGroup);

        const thighRGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.8, 8);
        const thighR = new THREE.Mesh(thighRGeo, skinMat);
        thighR.position.y = -0.4;
        rightLegGroup.add(thighR);

        const kneeR = kneeL.clone();
        rightLegGroup.add(kneeR);

        const shinR = shinL.clone();
        rightLegGroup.add(shinR);

        const footR = footL.clone();
        rightLegGroup.add(footR);

        // Set state API for Python webview
        window.setAvatarState = function(state) {
            if (STATES[state]) {
                targetState = state;
                transitionProgress = 0.0;
            }
        };

        // Eye blinking variables
        let blinkTimer = 0;
        let isBlinking = false;
        let blinkDuration = 0.12;
        let blinkElapsed = 0;

        // Render Clock
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Smooth State Transitions (Lerp glow color)
            if (transitionProgress < 1.0) {
                transitionProgress += delta * 2.5;
                if (transitionProgress > 1.0) transitionProgress = 1.0;

                const c1 = STATES[currentState].color;
                const c2 = STATES[targetState].color;
                const blended = new THREE.Color(c1).lerp(new THREE.Color(c2), transitionProgress);
                glowMat.color.copy(blended);

                if (transitionProgress === 1.0) {
                    currentState = targetState;
                }
            }

            const speed = STATES[currentState].speed;
            const pose = STATES[currentState].pose;

            // Apply Pose Gestures
            if (pose === 'idle') {
                const breathing = Math.sin(time * 1.5) * 0.03;
                character.position.y = -0.5 + breathing;
                headGroup.position.y = 1.45 + breathing * 0.3;
                
                headGroup.rotation.y = Math.sin(time * 0.6) * 0.04;
                headGroup.rotation.x = Math.cos(time * 0.4) * 0.03;
                headGroup.rotation.z = Math.sin(time * 0.5) * 0.02;

                leftArmGroup.rotation.z = Math.sin(time * 1.5) * 0.05 + 0.1;
                leftArmGroup.rotation.x = Math.cos(time * 0.8) * 0.04;
                forearmLGroup.rotation.x = 0.1;

                rightArmGroup.rotation.z = -Math.sin(time * 1.5) * 0.05 - 0.1;
                rightArmGroup.rotation.x = Math.cos(time * 0.8) * 0.04;
                forearmRGroup.rotation.x = 0.1;

                leftLegGroup.rotation.x = 0;
                rightLegGroup.rotation.x = 0;
                mouth.scale.set(1.0, 1.0, 1.0);

            } else if (pose === 'listening') {
                character.position.y = -0.53;
                
                headGroup.rotation.z = 0.14;
                headGroup.rotation.y = 0.18;
                headGroup.rotation.x = 0.05;

                leftArmGroup.rotation.z = -1.1;
                leftArmGroup.rotation.x = -0.5;
                forearmLGroup.rotation.x = 1.3;

                rightArmGroup.rotation.z = -0.05;
                rightArmGroup.rotation.x = 0.15;
                forearmRGroup.rotation.x = 0.1;

                leftLegGroup.rotation.x = 0.02;
                rightLegGroup.rotation.x = -0.02;
                mouth.scale.set(1.0, 1.0, 1.0);

            } else if (pose === 'thinking') {
                character.position.y = -0.5;
                
                headGroup.rotation.x = -0.12;
                headGroup.rotation.y = -0.15;
                headGroup.rotation.z = -0.05;

                leftArmGroup.rotation.z = -0.8;
                leftArmGroup.rotation.x = -0.8;
                forearmLGroup.rotation.x = 1.2;

                rightArmGroup.rotation.z = 0.4;
                rightArmGroup.rotation.x = -1.2;
                forearmRGroup.rotation.x = 1.4;

                const tap = Math.sin(time * 8.0) * 0.06;
                rightLegGroup.rotation.x = Math.max(0, tap);
                leftLegGroup.rotation.x = 0;
                mouth.scale.set(1.0, 1.0, 1.0);

            } else if (pose === 'speaking') {
                const bob = Math.sin(time * 3.0) * 0.02;
                character.position.y = -0.5 + bob;
                
                headGroup.rotation.x = 0.06 + Math.abs(Math.sin(time * 8.0)) * 0.08;
                headGroup.rotation.y = Math.sin(time * 1.2) * 0.1;
                headGroup.rotation.z = Math.sin(time * 0.6) * 0.03;

                leftArmGroup.rotation.z = -0.4 + Math.sin(time * 6.0) * 0.25;
                leftArmGroup.rotation.x = -0.3 + Math.cos(time * 5.0) * 0.2;
                forearmLGroup.rotation.x = 0.5 + Math.sin(time * 8.0) * 0.3;

                rightArmGroup.rotation.z = 0.4 - Math.cos(time * 5.5) * 0.25;
                rightArmGroup.rotation.x = -0.3 + Math.sin(time * 6.5) * 0.2;
                forearmRGroup.rotation.x = 0.5 + Math.cos(time * 7.5) * 0.3;

                const mouthOpen = 0.2 + Math.abs(Math.sin(time * 14.0)) * 1.8 * (0.6 + Math.cos(time * 5.0) * 0.4);
                mouth.scale.set(1.0 + mouthOpen * 0.2, 1.0 + mouthOpen * 2.0, 1.0);

                leftLegGroup.rotation.x = 0;
                rightLegGroup.rotation.x = 0;
            }

            // Blinking (Scales eyes vertically)
            blinkTimer += delta;
            if (!isBlinking && blinkTimer > 2.5 + Math.random() * 4.5) {
                isBlinking = true;
                blinkElapsed = 0;
            }

            if (isBlinking) {
                blinkElapsed += delta;
                let scaleY = 1.0;
                if (blinkElapsed < blinkDuration / 2) {
                    scaleY = 1.0 - (blinkElapsed / (blinkDuration / 2));
                } else if (blinkElapsed < blinkDuration) {
                    scaleY = (blinkElapsed - (blinkDuration / 2)) / (blinkDuration / 2);
                } else {
                    isBlinking = false;
                    blinkTimer = 0;
                    scaleY = 1.0;
                }
                eyeL.scale.y = scaleY;
                eyeR.scale.y = scaleY;
                pupilL.scale.y = scaleY;
                pupilR.scale.y = scaleY;
                shineL.scale.y = scaleY;
                shineR.scale.y = scaleY;
            }

            // Move dangling charms slightly
            charmL.position.y = 0.15 + Math.sin(time * 3.5) * 0.03;
            charmR.position.y = 0.15 + Math.sin(time * 3.5 + Math.PI) * 0.03;

            renderer.render(scene, camera);
        }

        // Init and Run
        window.setAvatarState('idle');
        animate();
    </script>
</body>
</html>
