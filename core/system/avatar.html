<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zero Custom 3D Puppet</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0);
            user-select: none;
            -webkit-user-select: none;
            -webkit-app-region: drag;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <script>
        // Colors from reference image
        const SKIN_COLOR = 0xc2a6de;       // Lavender/purple skin
        const OUTFIT_COLOR = 0x1f1d24;     // Dark charcoal
        const HAT_COLOR = 0x3d274c;        // Purple hat/horns
        const ACCENT_COLOR = 0x39ff14;     // Neon green

        // State parameters
        const STATES = {
            idle: {
                color: ACCENT_COLOR,
                speed: 1.0,
                pose: 'idle'
            },
            listening: {
                color: 0x00ffff,           // Cyan pulse during listening
                speed: 2.0,
                pose: 'listening'
            },
            thinking: {
                color: 0xff00ff,           // Magenta pulse during thinking
                speed: 3.0,
                pose: 'thinking'
            },
            speaking: {
                color: 0x00ffaa,           // Mint green pulse during speaking
                speed: 1.5,
                pose: 'speaking'
            }
        };

        let currentState = 'idle';
        let targetState = 'idle';
        let transitionProgress = 1.0;

        // Setup Scene
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.5, 6.2);
        camera.lookAt(0, 0, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(2, 4, 5);
        scene.add(dirLight);

        // Grid floor matching the image
        const gridHelper = new THREE.GridHelper(8, 16, 0x444455, 0x22222b);
        gridHelper.position.y = -2.1;
        scene.add(gridHelper);

        // Create Materials
        const skinMat = new THREE.MeshLambertMaterial({ color: SKIN_COLOR });
        const outfitMat = new THREE.MeshLambertMaterial({ color: OUTFIT_COLOR });
        const hatMat = new THREE.MeshLambertMaterial({ color: HAT_COLOR });
        
        // Dynamic Glowing Material (Color will blend based on state)
        const glowMat = new THREE.MeshBasicMaterial({
            color: ACCENT_COLOR,
            transparent: true,
            opacity: 0.95
        });

        // Main Character Group
        const character = new THREE.Group();
        character.position.y = -0.5; // Offset to sit on grid
        scene.add(character);

        // --- RIGGING HIERARCHY ---

        // 1. Torso
        const torsoGeo = new THREE.CylinderGeometry(0.55, 0.45, 1.3, 8);
        const torso = new THREE.Mesh(torsoGeo, outfitMat);
        torso.position.y = 0.55;
        character.add(torso);

        // Belt/Strap details on torso
        const beltGeo = new THREE.CylinderGeometry(0.58, 0.56, 0.2, 8);
        const belt = new THREE.Mesh(beltGeo, hatMat);
        belt.position.y = 0.3;
        character.add(belt);

        // Collar
        const collarGeo = new THREE.CylinderGeometry(0.35, 0.45, 0.18, 8);
        const collar = new THREE.Mesh(collarGeo, outfitMat);
        collar.position.y = 1.15;
        character.add(collar);

        // Shoulder pads
        const padGeo = new THREE.BoxGeometry(0.3, 0.15, 0.3);
        const padL = new THREE.Mesh(padGeo, glowMat);
        padL.position.set(-0.6, 1.1, 0);
        character.add(padL);

        const padR = padL.clone();
        padR.position.x = 0.6;
        character.add(padR);

        // 2. Head Group
        const headGroup = new THREE.Group();
        headGroup.position.y = 1.45;
        character.add(headGroup);

        // Face Mesh
        const faceGeo = new THREE.BoxGeometry(0.42, 0.42, 0.42);
        const face = new THREE.Mesh(faceGeo, skinMat);
        headGroup.add(face);

        // Simple Eye Dot / Face expression
        const eyeDotGeo = new THREE.BoxGeometry(0.04, 0.04, 0.02);
        const eyeDotMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const lEye = new THREE.Mesh(eyeDotGeo, eyeDotMat);
        lEye.position.set(-0.1, 0.05, 0.22);
        headGroup.add(lEye);

        const rEye = lEye.clone();
        rEye.position.x = 0.1;
        headGroup.add(rEye);

        // Mouth
        const mouthGeo = new THREE.BoxGeometry(0.06, 0.02, 0.02);
        const mouth = new THREE.Mesh(mouthGeo, eyeDotMat);
        mouth.position.set(0, -0.08, 0.22);
        headGroup.add(mouth);

        // 3. Curved Horn Hat
        // Horn center dome
        const hatDomeGeo = new THREE.SphereGeometry(0.3, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
        const hatDome = new THREE.Mesh(hatDomeGeo, hatMat);
        hatDome.position.y = 0.2;
        headGroup.add(hatDome);

        // Left Horn (Angled out)
        const hornLGeo = new THREE.CylinderGeometry(0.12, 0.3, 0.9, 8);
        const hornL = new THREE.Mesh(hornLGeo, hatMat);
        hornL.position.set(-0.55, 0.5, 0);
        hornL.rotation.z = -Math.PI / 3;
        headGroup.add(hornL);

        // Right Horn
        const hornR = hornL.clone();
        hornR.position.x = 0.55;
        hornR.rotation.z = Math.PI / 3;
        headGroup.add(hornR);

        // Dangling Charms
        const charmGeo = new THREE.SphereGeometry(0.08, 8, 8);
        const charmL = new THREE.Mesh(charmGeo, skinMat);
        charmL.position.set(-1.0, 0.2, 0);
        headGroup.add(charmL);

        const charmR = charmL.clone();
        charmR.position.x = 1.0;
        headGroup.add(charmR);

        // Central Hat Eye Plate
        const eyePlateGeo = new THREE.BoxGeometry(0.48, 0.3, 0.05);
        const eyePlate = new THREE.Mesh(eyePlateGeo, hatMat);
        eyePlate.position.set(0, 0.35, 0.2);
        headGroup.add(eyePlate);

        // Large Eye on plate
        const bigEyeGeo = new THREE.RingGeometry(0.04, 0.09, 16);
        const bigEye = new THREE.Mesh(bigEyeGeo, glowMat);
        bigEye.position.set(0, 0.35, 0.23);
        headGroup.add(bigEye);

        const pupilGeo = new THREE.CircleGeometry(0.03, 8);
        const pupil = new THREE.Mesh(pupilGeo, eyeDotMat);
        pupil.position.set(0, 0.35, 0.24);
        headGroup.add(pupil);

        // 4. Front Hanging Ribbons
        const ribbonGeo = new THREE.BoxGeometry(0.1, 0.8, 0.02);
        const ribbonL = new THREE.Mesh(ribbonGeo, hatMat);
        ribbonL.position.set(-0.25, -0.15, 0.22);
        headGroup.add(ribbonL);

        const ribbonR = ribbonL.clone();
        ribbonR.position.x = 0.25;
        headGroup.add(rEye.clone()); // Anchor cloned eyes for ribbon details
        headGroup.add(ribbonR);

        // Tiny eye decorations on ribbons
        const ribbonEyeGeo = new THREE.CircleGeometry(0.025, 8);
        const rEyeL1 = new THREE.Mesh(ribbonEyeGeo, glowMat);
        rEyeL1.position.set(-0.25, -0.05, 0.24);
        headGroup.add(rEyeL1);

        const rEyeL2 = rEyeL1.clone();
        rEyeL2.position.y = -0.3;
        headGroup.add(rEyeL2);

        const rEyeR1 = rEyeL1.clone();
        rEyeR1.position.x = 0.25;
        headGroup.add(rEyeR1);

        const rEyeR2 = rEyeL2.clone();
        rEyeR2.position.x = 0.25;
        headGroup.add(rEyeR2);

        // 5. LEFT ARM HIERARCHY
        const leftArmGroup = new THREE.Group();
        leftArmGroup.position.set(-0.65, 1.0, 0);
        character.add(leftArmGroup);

        const upperArmLGeo = new THREE.CylinderGeometry(0.12, 0.15, 0.6, 8);
        const upperArmL = new THREE.Mesh(upperArmLGeo, skinMat);
        upperArmL.position.y = -0.25;
        leftArmGroup.add(upperArmL);

        const forearmLGroup = new THREE.Group();
        forearmLGroup.position.set(0, -0.5, 0);
        leftArmGroup.add(forearmLGroup);

        const forearmLGeo = new THREE.CylinderGeometry(0.14, 0.12, 0.5, 8);
        const forearmL = new THREE.Mesh(forearmLGeo, skinMat);
        forearmL.position.y = -0.2;
        forearmLGroup.add(forearmL);

        const handLGeo = new THREE.SphereGeometry(0.08, 8, 8);
        const handL = new THREE.Mesh(handLGeo, outfitMat);
        handL.position.y = -0.45;
        forearmLGroup.add(handL);

        // 6. RIGHT ARM HIERARCHY
        const rightArmGroup = new THREE.Group();
        rightArmGroup.position.set(0.65, 1.0, 0);
        character.add(rightArmGroup);

        const upperArmRGeo = new THREE.CylinderGeometry(0.12, 0.15, 0.6, 8);
        const upperArmR = new THREE.Mesh(upperArmRGeo, skinMat);
        upperArmR.position.y = -0.25;
        rightArmGroup.add(upperArmR);

        const forearmRGroup = new THREE.Group();
        forearmRGroup.position.set(0, -0.5, 0);
        rightArmGroup.add(forearmRGroup);

        const forearmRGeo = new THREE.CylinderGeometry(0.14, 0.12, 0.5, 8);
        const forearmR = new THREE.Mesh(forearmRGeo, skinMat);
        forearmR.position.y = -0.2;
        forearmRGroup.add(forearmR);

        const handRGeo = new THREE.SphereGeometry(0.08, 8, 8);
        const handR = new THREE.Mesh(handRGeo, outfitMat);
        handR.position.y = -0.45;
        forearmRGroup.add(handR);

        // 7. LEFT LEG HIERARCHY
        const leftLegGroup = new THREE.Group();
        leftLegGroup.position.set(-0.25, 0, 0);
        character.add(leftLegGroup);

        const thighLGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.8, 8);
        const thighL = new THREE.Mesh(thighLGeo, skinMat);
        thighL.position.y = -0.4;
        leftLegGroup.add(thighL);

        const kneeLGeo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
        const kneeL = new THREE.Mesh(kneeLGeo, glowMat);
        kneeL.position.set(0, -0.8, 0.05);
        kneeL.rotation.z = Math.PI / 4;
        leftLegGroup.add(kneeL);

        const shinLGeo = new THREE.CylinderGeometry(0.18, 0.14, 0.7, 8);
        const shinL = new THREE.Mesh(shinLGeo, outfitMat);
        shinL.position.y = -1.15;
        leftLegGroup.add(shinL);

        const footLGeo = new THREE.ConeGeometry(0.14, 0.35, 4);
        const footL = new THREE.Mesh(footLGeo, hatMat);
        footL.position.set(0, -1.45, 0.1);
        footL.rotation.x = Math.PI / 2.2;
        leftLegGroup.add(footL);

        // 8. RIGHT LEG HIERARCHY
        const rightLegGroup = new THREE.Group();
        rightLegGroup.position.set(0.25, 0, 0);
        character.add(rightLegGroup);

        const thighRGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.8, 8);
        const thighR = new THREE.Mesh(thighRGeo, skinMat);
        thighR.position.y = -0.4;
        rightLegGroup.add(thighR);

        const kneeR = kneeL.clone();
        rightLegGroup.add(kneeR);

        const shinR = shinL.clone();
        rightLegGroup.add(shinR);

        const footR = footL.clone();
        rightLegGroup.add(footR);

        // Set state function exposed to Python
        window.setAvatarState = function(state) {
            if (STATES[state]) {
                targetState = state;
                transitionProgress = 0.0;
            }
        };

        // Animation calculations
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Smoothly Lerp Colors
            if (transitionProgress < 1.0) {
                transitionProgress += delta * 2.5;
                if (transitionProgress > 1.0) transitionProgress = 1.0;

                const c1 = STATES[currentState].color;
                const c2 = STATES[targetState].color;
                const blended = new THREE.Color(c1).lerp(new THREE.Color(c2), transitionProgress);
                glowMat.color.copy(blended);

                if (transitionProgress === 1.0) {
                    currentState = targetState;
                }
            }

            const speed = STATES[currentState].speed;
            const pose = STATES[currentState].pose;

            // Reset rot/pos defaults and apply state-based gestures
            if (pose === 'idle') {
                // Breathing bobs
                const breathing = Math.sin(time * 1.5) * 0.03;
                character.position.y = -0.5 + breathing;
                headGroup.position.y = 1.45 + breathing * 0.3;
                
                // Head sways
                headGroup.rotation.y = Math.sin(time * 0.6) * 0.04;
                headGroup.rotation.x = Math.cos(time * 0.4) * 0.03;
                headGroup.rotation.z = Math.sin(time * 0.5) * 0.02;

                // Arm sways
                leftArmGroup.rotation.z = Math.sin(time * 1.5) * 0.05 + 0.1;
                leftArmGroup.rotation.x = Math.cos(time * 0.8) * 0.04;
                forearmLGroup.rotation.x = 0.1;

                rightArmGroup.rotation.z = -Math.sin(time * 1.5) * 0.05 - 0.1;
                rightArmGroup.rotation.x = Math.cos(time * 0.8) * 0.04;
                forearmRGroup.rotation.x = 0.1;

                // Legs default
                leftLegGroup.rotation.x = 0;
                rightLegGroup.rotation.x = 0;
                mouth.scale.set(1.0, 1.0, 1.0);

            } else if (pose === 'listening') {
                // Attentive weight shift
                character.position.y = -0.53;
                
                // Tilt head to hand
                headGroup.rotation.z = 0.14;
                headGroup.rotation.y = 0.18;
                headGroup.rotation.x = 0.05;

                // Raise left arm to ear
                leftArmGroup.rotation.z = -1.1;
                leftArmGroup.rotation.x = -0.5;
                forearmLGroup.rotation.x = 1.3;

                // Right arm sways back
                rightArmGroup.rotation.z = -0.05;
                rightArmGroup.rotation.x = 0.15;
                forearmRGroup.rotation.x = 0.1;

                leftLegGroup.rotation.x = 0.02;
                rightLegGroup.rotation.x = -0.02;
                mouth.scale.set(1.0, 1.0, 1.0);

            } else if (pose === 'thinking') {
                // Cross arms, tap foot
                character.position.y = -0.5;
                
                // Tilt head up
                headGroup.rotation.x = -0.12;
                headGroup.rotation.y = -0.15;
                headGroup.rotation.z = -0.05;

                // Left arm crossed
                leftArmGroup.rotation.z = -0.8;
                leftArmGroup.rotation.x = -0.8;
                forearmLGroup.rotation.x = 1.2;

                // Right hand to chin
                rightArmGroup.rotation.z = 0.4;
                rightArmGroup.rotation.x = -1.2;
                forearmRGroup.rotation.x = 1.4;

                // Tapping foot
                const tap = Math.sin(time * 8.0) * 0.06;
                rightLegGroup.rotation.x = Math.max(0, tap);
                leftLegGroup.rotation.x = 0;
                mouth.scale.set(1.0, 1.0, 1.0);

            } else if (pose === 'speaking') {
                // Dynamic gestures while talking
                const bob = Math.sin(time * 3.0) * 0.02;
                character.position.y = -0.5 + bob;
                
                // Head nods
                headGroup.rotation.x = 0.06 + Math.abs(Math.sin(time * 8.0)) * 0.08;
                headGroup.rotation.y = Math.sin(time * 1.2) * 0.1;
                headGroup.rotation.z = Math.sin(time * 0.6) * 0.03;

                // Alternate hand waves
                leftArmGroup.rotation.z = -0.4 + Math.sin(time * 6.0) * 0.25;
                leftArmGroup.rotation.x = -0.3 + Math.cos(time * 5.0) * 0.2;
                forearmLGroup.rotation.x = 0.5 + Math.sin(time * 8.0) * 0.3;

                rightArmGroup.rotation.z = 0.4 - Math.cos(time * 5.5) * 0.25;
                rightArmGroup.rotation.x = -0.3 + Math.sin(time * 6.5) * 0.2;
                forearmRGroup.rotation.x = 0.5 + Math.cos(time * 7.5) * 0.3;

                // Mouth opens
                const mouthOpen = 0.2 + Math.abs(Math.sin(time * 14.0)) * 1.8 * (0.6 + Math.cos(time * 5.0) * 0.4);
                mouth.scale.set(1.0 + mouthOpen * 0.2, 1.0 + mouthOpen * 2.0, 1.0);

                leftLegGroup.rotation.x = 0;
                rightLegGroup.rotation.x = 0;
            }

            // Slowly rotate charms on horn ends
            charmL.position.y = 0.2 + Math.sin(time * 4.0) * 0.02;
            charmR.position.y = 0.2 + Math.sin(time * 4.0 + Math.PI) * 0.02;

            renderer.render(scene, camera);
        }

        // Initialize State
        window.setAvatarState('idle');
        
        // Start Render
        animate();
    </script>
</body>
</html>
